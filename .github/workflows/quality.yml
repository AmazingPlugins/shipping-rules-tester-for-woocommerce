name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  browser:
    name: Browser / HPOS ${{ matrix.hpos }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        hpos: ['yes', 'no']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build and extract release package
        run: |
          scripts/build-release.sh
          unzip -q dist/*.zip -d dist/extracted
      - name: Run isolated browser and integration suites
        env:
          SRT_RUN_BROWSER: 'yes'
          SRT_RUN_PLUGIN_CHECK: ${{ matrix.hpos }}
          SRT_HPOS_MODE: ${{ matrix.hpos }}
          SRT_PLUGIN_DIR: ${{ github.workspace }}/dist/extracted/ap-shipping-rules-tester-for-woocommerce
        run: tests/integration/hpos-sandbox.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures-${{ matrix.hpos }}
          path: test-results/
          retention-days: 7

  quality:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.2', '8.3']

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install development dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run unit tests
        run: composer test

      - name: Run PHPCS
        run: composer cs

      - name: Run PHPStan
        run: composer stan

      - name: Check PHP syntax
        run: find src templates -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check JavaScript syntax
        run: |
          node --check assets/admin.js
          node --check assets/product-picker.js

      - name: Check diff whitespace
        run: git diff --check

  integration:
    name: WordPress ${{ matrix.wordpress }} / WooCommerce ${{ matrix.woocommerce || 'latest' }} / HPOS ${{ matrix.hpos }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: '6.6-php8.2-apache'
            woocommerce: '7.0.0'
            hpos: 'no'
          - wordpress: '6.6-php8.2-apache'
            woocommerce: '7.0.0'
            hpos: 'yes'
          - wordpress: 'latest'
            woocommerce: ''
            hpos: 'no'
          - wordpress: 'latest'
            woocommerce: ''
            hpos: 'yes'

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run WooCommerce integration sandbox
        env:
          SRT_HPOS_MODE: ${{ matrix.hpos }}
          SRT_WP_IMAGE: wordpress:${{ matrix.wordpress }}
          SRT_WC_VERSION: ${{ matrix.woocommerce }}
          SRT_PLUGIN_DIR: ${{ github.workspace }}/dist/extracted/ap-shipping-rules-tester-for-woocommerce
        run: |
          scripts/build-release.sh
          unzip -q dist/*.zip -d dist/extracted
          tests/integration/hpos-sandbox.sh

  deploy:
    name: Publish to WordPress.org
    if: startsWith(github.ref, 'refs/tags/')
    needs: [browser, quality, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4

      - name: Require the tag to match the plugin version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          tag="${tag#v}"
          header=$(sed -n 's/^ \* Version: *//p' shipping-rules-tester-for-woocommerce.php | head -n 1 | tr -d '[:space:]')
          stable=$(sed -n 's/^Stable tag: *//p' readme.txt | head -n 1 | tr -d '[:space:]')
          case "$tag" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "Tag $tag must look like 1.2.3."
              exit 1
              ;;
          esac
          if [ "$tag" != "$header" ] || [ "$tag" != "$stable" ]; then
            echo "Tag $tag does not match header '$header' and readme stable tag '$stable'."
            exit 1
          fi

      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: ap-shipping-rules-tester-for-woocommerce
